<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT 小伙伴</title>
  <style>
    :root { color-scheme: light dark; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    body { width: 290px; margin: 0; padding: 16px; background: #fbf8ff; color: #261f2d; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 52px; height: 52px; object-fit: cover; object-position: 72% 64%; border-radius: 50%; background: #eee5ff; }
    h1 { margin: 0; font-size: 18px; }
    p { margin: 3px 0 0; color: #665d6d; font-size: 12px; line-height: 1.45; }
    .stack { display: grid; gap: 8px; }
    button { min-height: 38px; border: 1px solid #7d6a8d; border-radius: 10px; background: #fff; color: #2c2234; cursor: pointer; font: inherit; }
    button:hover { background: #f0e8fa; }
    button:focus-visible { outline: 3px solid #5d8ce8; outline-offset: 2px; }
    .danger { color: #8a2439; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #status { min-height: 18px; margin-top: 10px; font-size: 12px; }
    #connection { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #eee7f6; font-size: 12px; }
    #connection.connected { background: #e0f3e6; color: #1f6032; }
    #connection.disconnected { background: #ffe8ec; color: #84263a; }
    details { margin-top: 10px; font-size: 12px; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #251f2b; color: #f7f1fa; }
      p { color: #c8bdcd; }
      button { background: #342b3d; color: #f7f1fa; border-color: #8e7a9e; }
      button:hover { background: #493b55; }
      .danger { color: #ff9aac; }
      #connection { background: #44384f; }
      #connection.connected { background: #243f2d; color: #b8efc7; }
      #connection.disconnected { background: #512d36; color: #ffc0cb; }
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/icon.png" alt="">
    <div><h1>GPT 小伙伴</h1><p>余额与重置时间，一眼就看到</p></div>
  </header>
  <div id="connection" role="status">正在检查当前页面…</div>
  <main class="stack">
    <button id="background" type="button" aria-pressed="false">开启后台更新</button>
    <p>开启后维护一个后台用量标签页，每分钟尝试更新。请确认该页是你要查看的账号和工作区；其快照不代表其他账号。</p>
    <p id="reader-status" role="status">后台更新已关闭</p>
    <button id="refresh-background" type="button" hidden>立即尝试更新</button>
    <button id="show" type="button">恢复显示挂件</button>
    <button id="animation" type="button">切换动画</button>
    <div class="row">
      <button id="smaller" type="button">缩小</button>
      <button id="larger" type="button">放大</button>
    </div>
    <button id="clear" class="danger" type="button">清除本地用量数据</button>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <details>
    <summary>网页没有显示角色？</summary>
    <p>确认当前页面是 chatgpt.com；在 Edge 的扩展详情中，将“站点访问权限”设为允许访问 chatgpt.com，然后刷新网页。</p>
  </details>
  <script src="popup.js"></script>
</body>
</html>
