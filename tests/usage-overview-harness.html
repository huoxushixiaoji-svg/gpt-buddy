<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Usage Overview Adapter Test</title></head>
<body>
  <main>
    <h1>Usage</h1>
    <section>
      <h2>Codex</h2>
      <article>
        <header>用量项目</header>
        <div id="five-hour-reading">5 小时额度 剩余 68%</div>
        <div>Resets 18:30</div>
      </article>
      <article>
        <header>用量项目</header>
        <div>周额度 已用 35%</div>
        <div>Resets Friday 10:00</div>
      </article>
      <section aria-label="使用限额重置">
        <h3>使用限额重置</h3>
        <p>使用一次重置，即可恢复你的 5 小时限额、每周限额，或同时恢复两者</p>
        <div>
          <span>可用</span> <span id="reset-allowance">1</span>
          <span>历史记录</span>
          <div>完全重置（每周 + 5 小时）</div>
          <div>将于 11 月 7 日 GMT+8 05:25 到期</div>
        </div>
      </section>
      <section hidden><h3>使用限额重置</h3><div>可用 9</div></section>
    </section>
  </main>
  <script src="../parser.js"></script>
  <script>
    window.testUsageItems = GPTBuddy.parser.scanVisibleUsage(document, {
      now: Date.now(),
      location: { hostname: 'chatgpt.com', pathname: '/settings/usage', search: '?tab=overview' }
    });
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
